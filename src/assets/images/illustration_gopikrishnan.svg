<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-gopi" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
  </defs>

  <!-- Technical Framing -->
  <rect width="280" height="280" fill="url(#bg-grad-gopi)" rx="16" />
  <circle cx="140" cy="135" r="115" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
  <circle cx="140" cy="135" r="108" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Body / Casual Student Hoodie -->
  <g id="body">
    <!-- Hoodie Shoulders -->
    <path d="M55 248 C 65 195, 95 170, 115 162 L 122 148 C 118 144, 116 138, 116 130 L 120 130 C 120 136, 122 140, 126 142 L 130 156 L 150 156 L 154 142 C 158 140, 160 136, 160 130 L 164 130 C 164 138, 162 144, 158 148 L 165 162 C 185 170, 215 195, 225 248 Z" 
          fill="#334155" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Hoodie V-neck / strings -->
    <path d="M124 158 L 140 182 L 156 158" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
    <line x1="134" y1="172" x2="134" y2="198" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="146" y1="172" x2="146" y2="198" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M126 122 L 126 148 L 154 148 L 154 122 Z" fill="#fed7aa" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Head & Classmate Features (Gopi Krishnan) -->
  <g id="head">
    <path d="M106 98 C 100 94, 100 114, 107 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />
    <path d="M174 98 C 180 94, 180 114, 173 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />

    <!-- Face Shape - Neat, quiet, friendly classmate -->
    <path d="M108 92 C 108 132, 118 146, 140 146 C 162 146, 172 132, 172 92 C 172 62, 160 52, 140 52 C 120 52, 108 62, 108 92 Z" 
          fill="#fed7aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Eyebrows (Gentle, reserved) -->
    <path d="M118 85 Q 128 84 134 87" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M146 87 Q 152 84 162 85" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Quiet, patient) -->
    <ellipse cx="126" cy="93" rx="4" ry="3.5" fill="#0f172a" />
    <circle cx="127" cy="92" r="1" fill="#ffffff" />
    <ellipse cx="154" cy="93" rx="4" ry="3.5" fill="#0f172a" />
    <circle cx="155" cy="92" r="1" fill="#ffffff" />

    <!-- Nose -->
    <path d="M139 93 L 141 107 L 137 109" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth - Reserved mild smile -->
    <path d="M130 124 Q 140 127 150 124" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />

    <!-- Hair - Clean side-parted student crop -->
    <path d="M106 78 C 104 48, 118 36, 140 36 C 162 36, 174 48, 174 78 C 174 80, 168 70, 160 68 C 150 66, 130 66, 120 68 C 112 70, 108 74, 106 78 Z" 
          fill="#1e293b" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Technical Overlay HUD Badge -->
  <g transform="translate(30, 244)">
    <rect width="220" height="24" rx="4" fill="#334155" />
    <text x="110" y="16" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" letter-spacing="1">
      GOPI KRISHNAN // HX-003
    </text>
  </g>

  <!-- Connection Only Badge -->
  <rect x="20" y="18" width="136" height="18" rx="3" fill="#64748b" />
  <text x="88" y="31" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    NOT OBSERVING // FRIEND
  </text>
</svg>
