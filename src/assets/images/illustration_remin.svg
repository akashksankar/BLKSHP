<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-remin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </radialGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Technical Framing -->
  <rect width="280" height="280" fill="url(#bg-grad-remin)" rx="16" />
  <circle cx="140" cy="135" r="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
  <circle cx="140" cy="135" r="108" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Technical Reticle Marks -->
  <line x1="140" y1="12" x2="140" y2="24" stroke="#dc2626" stroke-width="2" />
  <line x1="140" y1="246" x2="140" y2="258" stroke="#dc2626" stroke-width="2" />
  <line x1="17" y1="135" x2="29" y2="135" stroke="#000000" stroke-width="2" />
  <line x1="251" y1="135" x2="263" y2="135" stroke="#000000" stroke-width="2" />

  <!-- Body / Shoulders (Modern Casual College Outfit) -->
  <g id="body">
    <!-- Torso Jacket / Shirt -->
    <path d="M55 248 C 65 195, 95 170, 115 162 L 122 148 C 118 144, 116 138, 116 130 L 120 130 C 120 136, 122 140, 126 142 L 130 156 L 150 156 L 154 142 C 158 140, 160 136, 160 130 L 164 130 C 164 138, 162 144, 158 148 L 165 162 C 185 170, 215 195, 225 248 Z" 
          fill="#18181b" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Red Accent Inner Collar / CPIM LDF Scarf Lapel -->
    <path d="M120 162 L 140 196 L 160 162" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5" />
    <polygon points="140,178 143,184 150,185 145,190 146,197 140,193 134,197 135,190 130,185 137,184" fill="#ffffff" />

    <!-- Open Collar Line -->
    <path d="M126 156 L 140 180 L 154 156" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M126 122 L 126 148 L 154 148 L 154 122 Z" fill="#fed7aa" stroke="#000000" stroke-width="2" />
    <path d="M126 138 C 135 144, 145 144, 154 138" fill="none" stroke="#f97316" stroke-width="1.5" />
  </g>

  <!-- Head & Facial Features (A S Remin Krishna) -->
  <g id="head">
    <!-- Ears -->
    <path d="M106 98 C 100 94, 100 114, 107 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />
    <path d="M174 98 C 180 94, 180 114, 173 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />

    <!-- Face Shape - Youthful, expressive jawline -->
    <path d="M108 92 C 108 132, 118 146, 140 146 C 162 146, 172 132, 172 92 C 172 62, 160 52, 140 52 C 120 52, 108 62, 108 92 Z" 
          fill="#fed7aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Expressive Eyebrows (Dynamic & playful roaster arch) -->
    <path d="M118 84 Q 128 80 134 85" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round" />
    <path d="M146 85 Q 152 80 162 84" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round" />

    <!-- Eyes (Alert, confident extrovert gaze) -->
    <ellipse cx="126" cy="92" rx="4.5" ry="3.5" fill="#000000" />
    <circle cx="127.5" cy="91" r="1.2" fill="#ffffff" />
    <ellipse cx="154" cy="92" rx="4.5" ry="3.5" fill="#000000" />
    <circle cx="155.5" cy="91" r="1.2" fill="#ffffff" />

    <!-- Stylish Red-Rimmed Spectacles -->
    <rect x="115" y="84" width="22" height="16" rx="4" fill="none" stroke="#dc2626" stroke-width="2" />
    <rect x="143" y="84" width="22" height="16" rx="4" fill="none" stroke="#dc2626" stroke-width="2" />
    <line x1="137" y1="91" x2="143" y2="91" stroke="#dc2626" stroke-width="2" />
    <line x1="115" y1="91" x2="108" y2="89" stroke="#dc2626" stroke-width="1.8" />
    <line x1="165" y1="91" x2="172" y2="89" stroke="#dc2626" stroke-width="1.8" />

    <!-- Nose -->
    <path d="M138 92 L 141 106 L 137 108" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth - Witty, energetic roaster smirk -->
    <path d="M128 122 Q 138 128 152 121" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    <path d="M152 121 Q 155 119 157 121" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />

    <!-- Youthful Hair (Voluminous, stylish modern student crop with texture) -->
    <path d="M106 76 C 104 46, 120 34, 140 34 C 164 34, 176 46, 174 76 C 174 78, 170 70, 164 68 C 152 64, 132 62, 122 66 C 114 69, 108 74, 106 76 Z" 
          fill="#09090b" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    <path d="M112 56 Q 126 42 144 46" fill="none" stroke="#27272a" stroke-width="2" />
    <path d="M136 40 Q 152 38 166 48" fill="none" stroke="#27272a" stroke-width="2" />
  </g>

  <!-- Technical Overlay HUD Badge -->
  <g transform="translate(40, 244)">
    <rect width="200" height="24" rx="4" fill="#000000" />
    <text x="100" y="16" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="1">
      A S REMIN KRISHNA // HX-001
    </text>
  </g>

  <!-- Clearance & Target Pin -->
  <rect x="20" y="18" width="86" height="18" rx="3" fill="#dc2626" />
  <text x="63" y="31" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    SOLE ACTIVE TARGET
  </text>
</svg>
