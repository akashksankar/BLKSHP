<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-fac1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </radialGradient>
  </defs>

  <!-- Technical Framing -->
  <rect width="280" height="280" fill="url(#bg-grad-fac1)" rx="16" />
  <circle cx="140" cy="135" r="115" fill="#ffffff" stroke="#27272a" stroke-width="2.5" />
  <circle cx="140" cy="135" r="108" fill="none" stroke="#71717a" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Body / Formal Academic Professor Suit -->
  <g id="body">
    <!-- Suit Jacket -->
    <path d="M55 248 C 65 195, 95 170, 115 162 L 122 148 C 118 144, 116 138, 116 130 L 120 130 C 120 136, 122 140, 126 142 L 130 156 L 150 156 L 154 142 C 158 140, 160 136, 160 130 L 164 130 C 164 138, 162 144, 158 148 L 165 162 C 185 170, 215 195, 225 248 Z" 
          fill="#27272a" stroke="#09090b" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- White Collared Shirt & Dark Blue/Gray Tie -->
    <path d="M126 156 L 140 184 L 154 156 Z" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
    <polygon points="137,162 143,162 145,188 140,198 135,188" fill="#1e293b" stroke="#0f172a" stroke-width="1" />

    <!-- Neck -->
    <path d="M126 122 L 126 148 L 154 148 L 154 122 Z" fill="#fed7aa" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Head & Professor Features -->
  <g id="head">
    <path d="M106 98 C 100 94, 100 114, 107 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />
    <path d="M174 98 C 180 94, 180 114, 173 116" fill="#fed7aa" stroke="#000000" stroke-width="2" />

    <!-- Face Shape - Mature, dignified academic -->
    <path d="M108 92 C 108 132, 118 146, 140 146 C 162 146, 172 132, 172 92 C 172 62, 160 52, 140 52 C 120 52, 108 62, 108 92 Z" 
          fill="#fed7aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Mature Eyebrows -->
    <path d="M116 83 Q 126 82 134 85" fill="none" stroke="#52525b" stroke-width="2.8" stroke-linecap="round" />
    <path d="M146 85 Q 154 82 164 83" fill="none" stroke="#52525b" stroke-width="2.8" stroke-linecap="round" />

    <!-- Eyes (Patient, bemused academic gaze) -->
    <ellipse cx="126" cy="92" rx="4" ry="3" fill="#000000" />
    <ellipse cx="154" cy="92" rx="4" ry="3" fill="#000000" />

    <!-- Professor Wireframe Glasses -->
    <rect x="114" y="84" width="24" height="17" rx="3" fill="none" stroke="#000000" stroke-width="1.8" />
    <rect x="142" y="84" width="24" height="17" rx="3" fill="none" stroke="#000000" stroke-width="1.8" />
    <line x1="138" y1="92" x2="142" y2="92" stroke="#000000" stroke-width="1.8" />
    <line x1="114" y1="92" x2="108" y2="90" stroke="#000000" stroke-width="1.5" />
    <line x1="166" y1="92" x2="172" y2="90" stroke="#000000" stroke-width="1.5" />

    <!-- Nose & Smile Lines -->
    <path d="M138 92 L 140 108 L 136 110" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M118 108 Q 120 114 122 118" fill="none" stroke="#d4d4d8" stroke-width="1.5" />
    <path d="M162 108 Q 160 114 158 118" fill="none" stroke="#d4d4d8" stroke-width="1.5" />

    <!-- Calming smile / bemused with Remin -->
    <path d="M128 124 Q 140 128 152 124" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />

    <!-- Distinguished Graying Hair -->
    <path d="M106 80 C 104 50, 118 36, 140 36 C 162 36, 174 50, 174 80 C 174 82, 168 72, 160 70 C 150 68, 130 68, 120 70 C 112 72, 108 76, 106 80 Z" 
          fill="#52525b" stroke="#3f3f46" stroke-width="2" stroke-linejoin="round" />
    <path d="M116 54 Q 130 46 144 48" fill="none" stroke="#a1a1aa" stroke-width="1.8" />
    <path d="M138 42 Q 152 40 164 48" fill="none" stroke="#a1a1aa" stroke-width="1.8" />
  </g>

  <!-- Technical Overlay HUD Badge -->
  <g transform="translate(30, 244)">
    <rect width="220" height="24" rx="4" fill="#27272a" />
    <text x="110" y="16" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" letter-spacing="1">
      FACULTY 1 MCA // HX-002
    </text>
  </g>

  <!-- Connection Only Badge -->
  <rect x="20" y="18" width="130" height="18" rx="3" fill="#71717a" />
  <text x="85" y="31" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    NOT OBSERVING // CONNECTION
  </text>
</svg>
